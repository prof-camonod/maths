<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flashcards</title>

  <style>
    body {
      font-family: Arial;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f0f0f0;
    }

    select {
      margin-bottom: 20px;
      padding: 5px;
    }

    .card-container {
      perspective: 1000px;
    }

    .card {
      width: 300px;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      cursor: pointer;
    }

    .card.flip {
      transform: rotateY(180deg);
    }

    .side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      padding: 20px;
      text-align: center;
      font-size: 18px;
    }

    .back {
      transform: rotateY(180deg);
      background: #007BFF;
      color: white;
    }

    .controls {
      margin-top: 20px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      background: #007BFF;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Choisir un deck :</h2>

<select id="deckSelector" onchange="loadDeck()">
  <option value="math.json">Math</option>
  <option value="histoire.json">Histoire</option>
  <option value="anglais.json">Anglais</option>
</select>

<div class="card-container">
  <div class="card" id="card" onclick="flipCard()">
    <div class="side front" id="question">Question</div>
    <div class="side back" id="answer">Réponse</div>
  </div>
</div>

<div class="controls">
  <button onclick="prevCard()">⬅️</button>
  <button onclick="nextCard()">➡️</button>
</div>

<script src="flashcards.js"></script>

</body>
</html>
